[package]
# Published as "git-tonic" because "tonic" is taken on crates.io (the gRPC
# crate). The installed binary is still "tonic" — see [[bin]] below.
name = "git-tonic"
version = "0.2.0"
edition = "2021"
description = "A git worktree companion"
license = "MIT"
repository = "https://github.com/thombruce/tonic"
readme = "README.md"
keywords = ["git", "worktree", "cli", "workflow"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "tonic"
path = "src/main.rs"

[lib]
name = "tonic"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
glob = "0.3"
dirs = "5"
owo-colors = { version = "4", features = ["supports-colors"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
# Deny panics and their siblings — a user-facing CLI should return errors, not
# panic. Production code already complies; tests opt out (see mod tests).
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
