[package]
# Published as "git-tonic" because "tonic" is taken on crates.io (the gRPC
# crate). The installed binary is still "tonic" — see [[bin]] below.
name = "git-tonic"
version = "0.1.0"
edition = "2021"
description = "A git worktree companion"
license = "MIT"
repository = "https://github.com/thombruce/tonic"
readme = "README.md"
keywords = ["git", "worktree", "cli", "workflow"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "tonic"
path = "src/main.rs"

[lib]
name = "tonic"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
glob = "0.3"
dirs = "5"
