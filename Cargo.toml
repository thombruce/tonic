[package]
name = "tonic"
version = "0.1.0"
edition = "2021"
description = "A git worktree companion"

[[bin]]
name = "tonic"
path = "src/main.rs"

[lib]
name = "tonic"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
glob = "0.3"
dirs = "5"
